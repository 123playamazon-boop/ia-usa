<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>IA USA · Pedidos (equipe)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}</script>
<style>
:root{--navy:#0d2440;--navy2:#13325c;--accent:#f47920;--accent-d:#d9650f;--line:#e4e9f0;--muted:#6b7c92;--ok:#16a34a;--bg:#f4f6fa}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#13233a}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header .t{font-weight:800;font-size:17px}header .t b{color:var(--accent)}
header .sp{flex:1}
button{font-family:inherit;cursor:pointer;border:0;border-radius:9px;font-weight:700}
.btn{background:var(--accent);color:#fff;padding:9px 14px}.btn:hover{background:var(--accent-d)}
.btn.g{background:#1f2d44}.btn.ok{background:var(--ok)}.btn.ghost{background:#eef2f7;color:#1f2d44}
.wrap{max-width:900px;margin:0 auto;padding:18px}
.login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center;box-shadow:0 10px 30px rgba(13,36,64,.08)}
.login h1{font-size:20px;margin:0 0 6px}.login p{color:var(--muted);font-size:13px;margin:0 0 16px}
input,select{font-family:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 2px 8px rgba(13,36,64,.04)}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ch .id{font-weight:800}.ch .dt{color:var(--muted);font-size:12px}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.b-pago{background:#fff3e6;color:var(--accent-d)}.b-despachado{background:#e7f6ec;color:var(--ok)}.b-novo{background:#eef2f7;color:var(--muted)}
.cli{font-weight:700;font-size:15px}.sub{color:var(--muted);font-size:13px;margin:2px 0}
.items{margin:10px 0;padding:10px 12px;background:#f8fafc;border-radius:10px;font-size:13.5px}
.items .it{padding:3px 0;border-bottom:1px dashed #e7edf4}.items .it:last-child{border:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.val{font-size:14px;font-weight:600}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.step{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.step .dot{width:16px;height:16px;border-radius:50%;background:#dfe6ef;display:grid;place-items:center;color:#fff;font-size:10px}
.step.on{color:var(--ok)}.step.on .dot{background:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.rk{display:flex;gap:6px;align-items:center;flex:1;min-width:230px}
.rk input{flex:1}
.empty{text-align:center;color:var(--muted);padding:40px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#13233a;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:50}
.toast.on{opacity:1}
.muted{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const API="https://qfxemysisbyqevxfihvd.supabase.co/functions/v1/iausa-admin";
const REMET={nome:"IA USA LLC",end:"NW 24th Terrace, Miami-Dade County, Miami, FL 33172, USA"};
let PASS=localStorage.getItem("iausa_admin_pass")||"";
let PEDIDOS=[];
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2600);}
async function api(action,extra){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,pass:PASS,...extra})});return await r.json();}

function loginView(){
  document.getElementById("app").innerHTML=`<div class="login"><h1>Pedidos IA USA</h1><p>Área da equipe — entre com a senha</p>
  <input id="pw" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn" style="width:100%;margin-top:12px" onclick="doLogin()">Entrar</button></div>`;
  setTimeout(()=>document.getElementById("pw")?.focus(),100);
}
async function doLogin(){PASS=document.getElementById("pw").value.trim();const r=await api("list");if(r&&r.ok){localStorage.setItem("iausa_admin_pass",PASS);PEDIDOS=r.pedidos||[];render();}else{toast("Senha inválida");}}
async function load(){const r=await api("list");if(r&&r.ok){PEDIDOS=r.pedidos||[];render();}else if(r&&r.error==="senha_invalida"){PASS="";loginView();}else{toast("Erro ao carregar");}}

function itemsHtml(p){const its=Array.isArray(p.itens)?p.itens:[];if(!its.length)return `<div class="muted">Pedido em texto livre${p.dados_extra?' — ver abaixo':''}.</div>`;return its.map(i=>`<div class="it">• ${esc(i.nome||'Produto')}${i.tamanho?` — Tam: ${esc(i.tamanho)}`:''}${i.qtd&&i.qtd>1?` — ${i.qtd}x`:''}</div>`).join('');}
function stepHtml(p){const pago=true,decl=!!(p.nome&&p.cpf&&p.endereco),etq=!!p.etiqueta_ok,rastr=!!p.rastreio,avis=!!p.rastreio_enviado;
  const s=(on,n,t)=>`<div class="step ${on?'on':''}"><span class="dot">${on?'✓':n}</span>${t}</div>`;
  return `<div class="steps">${s(pago,1,'Pago')}${s(decl,2,'Declaração')}${s(etq,3,'Etiqueta')}${s(rastr,4,'Rastreio')}${s(avis,5,'Cliente avisado')}</div>`;}

function card(p){
  const st=(p.status||'novo');const badge=st==='despachado'?'b-despachado':(st==='pago'?'b-pago':'b-novo');
  const dt=p.created_at?new Date(p.created_at).toLocaleString('pt-BR'):'';
  return `<div class="card">
    <div class="ch"><span class="id">#${p.id}</span><span class="badge ${badge}">${esc(st)}</span><span class="dt">${dt}</span></div>
    <div class="cli">${esc(p.nome||'(sem nome)')}</div>
    <div class="sub">📱 ${esc(p.phone||'—')}${p.cpf?` · CPF ${esc(p.cpf)}`:''}</div>
    <div class="items">${itemsHtml(p)}</div>
    <div class="grid2">
      <div><div class="lbl">Endereço de entrega</div><div class="val">${esc(p.endereco||'—')}</div></div>
      <div><div class="lbl">Remetente</div><div class="val">${REMET.nome} · Miami, FL</div></div>
    </div>
    ${stepHtml(p)}
    <div class="actions">
      <button class="btn g" onclick="imprimir(${p.id})">🖨️ Imprimir declaração</button>
      <input type="file" id="ef_${p.id}" accept="image/*,application/pdf" style="display:none" onchange="subirEtiqueta(${p.id},this)">
      <button class="btn ${p.etiqueta_url?'ok':'ghost'}" onclick="document.getElementById('ef_${p.id}').click()">${p.etiqueta_url?'✓ Etiqueta salva — trocar':'📎 Subir etiqueta (lê o tracking)'}</button>
      ${p.etiqueta_url?`<button class="btn ghost" onclick="verEtiqueta(${p.id})">👁️ Ver</button>`:''}
    </div>
    <div class="actions" style="border:0;padding-top:8px">
      <div class="rk"><input id="rk_${p.id}" placeholder="Nº de rastreio" value="${esc(p.rastreio||p.rastreio_sugerido||'')}">
        <select id="tr_${p.id}" style="width:130px"><option value="">Transp.</option>${['Correios','DHL','FedEx','UPS','USPS'].map(t=>`<option ${p.transportadora===t?'selected':''}>${t}</option>`).join('')}</select>
        <button class="btn ghost" onclick="salvarRastreio(${p.id})">Salvar</button></div>
      ${(!p.rastreio&&p.rastreio_sugerido)?`<div style="font-size:11.5px;color:#1fa14f;margin:-2px 0 4px">🔎 Tracking lido da etiqueta — confira e clique em Salvar.</div>`:''}
      <button class="btn" onclick="avisar(${p.id})">📲 Avisar cliente</button>
    </div>
  </div>`;
}
function render(){
  const n=PEDIDOS.length;
  document.getElementById("app").innerHTML=`<header><span class="t">IA <b>USA</b> · Pedidos</span><span class="sp"></span>
    <button class="btn g" onclick="load()">↻ Atualizar</button><button class="btn ghost" onclick="sair()">Sair</button></header>
    <div class="wrap">${n?PEDIDOS.map(card).join(''):'<div class="empty">Nenhum pedido ainda. Quando um cliente fechar no WhatsApp, aparece aqui.</div>'}</div>`;
}
function sair(){localStorage.removeItem("iausa_admin_pass");PASS="";loginView();}

function imgRedimensionada(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const sc=Math.min(1,max/Math.max(w,h));const cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,0,0,cw,ch);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.85));};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('imagem inválida'));};img.src=url;});}
async function pdfPrimeiraPagina(file){if(!window.pdfjsLib)throw new Error('leitor de PDF não carregou');const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;const page=await pdf.getPage(1);const vp=page.getViewport({scale:2});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c.toDataURL('image/jpeg',0.85);}
async function subirEtiqueta(id,inp){const file=inp.files&&inp.files[0];inp.value='';if(!file)return;toast("Lendo a etiqueta…");try{let dataUrl;if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){dataUrl=await pdfPrimeiraPagina(file);}else{dataUrl=await imgRedimensionada(file);}if(!dataUrl){toast("Não consegui ler o arquivo");return;}const r=await api("ler_etiqueta",{id,file_b64:dataUrl,file_name:file.name});if(!r.ok){toast("Erro: "+(r.error||""));return;}const p=PEDIDOS.find(x=>x.id===id);if(p){p.etiqueta_url='1';p.etiqueta_ok=true;p._etiqueta_link=r.etiqueta_link||null;if(r.tracking)p.rastreio_sugerido=r.tracking;}render();if(r.tracking){const el=document.getElementById('rk_'+id);if(el){el.value=r.tracking;el.style.borderColor='#1fa14f';}toast("Etiqueta salva · tracking lido: "+r.tracking+" — confira e Salvar");}else{toast("Etiqueta salva, mas não achei o tracking — digite manualmente");}}catch(e){toast("Falha: "+(e.message||e));}}
async function verEtiqueta(id){const p=PEDIDOS.find(x=>x.id===id);let link=p&&p._etiqueta_link;if(!link){const r=await api("etiqueta_link",{id});if(r.ok)link=r.etiqueta_link;}if(link)window.open(link,'_blank');else toast("Não consegui abrir a etiqueta");}
async function salvarRastreio(id){const rastreio=document.getElementById("rk_"+id).value.trim();const transportadora=document.getElementById("tr_"+id).value;const r=await api("update",{id,rastreio,transportadora});if(r.ok){const p=PEDIDOS.find(x=>x.id===id);if(p){p.rastreio=rastreio;p.transportadora=transportadora;}toast("Rastreio salvo");render();}else toast("Erro");}
async function avisar(id){const rastreio=document.getElementById("rk_"+id).value.trim();if(!rastreio){toast("Coloque o rastreio primeiro");return;}const transportadora=document.getElementById("tr_"+id).value;if(!confirm("Enviar o código de rastreio pro WhatsApp do cliente?"))return;const r=await api("notify",{id,rastreio,transportadora});if(r.ok){toast(r.sent?"Cliente avisado no WhatsApp ✓":"Salvo, mas o envio falhou");load();}else toast("Erro: "+(r.error||""));}

function imprimir(id){
  const p=PEDIDOS.find(x=>x.id===id);if(!p)return;
  const its=Array.isArray(p.itens)?p.itens:[];
  const linhas=its.length?its.map(i=>`<tr><td>${esc(i.nome||'Produto')}${i.tamanho?` (Tam ${esc(i.tamanho)})`:''}</td><td style="text-align:center">${i.qtd||1}</td></tr>`).join(''):`<tr><td colspan="2">${esc(p.dados_extra||'—')}</td></tr>`;
  const w=window.open('','_blank');
  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Declaração #${p.id}</title>
  <style>body{font-family:Arial,sans-serif;color:#111;max-width:740px;margin:24px auto;padding:0 20px;font-size:13px}
  h1{font-size:18px;text-align:center;border-bottom:2px solid #0d2440;padding-bottom:8px;color:#0d2440}
  .box{border:1px solid #ccc;border-radius:8px;padding:12px 14px;margin:12px 0}
  .box h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;color:#6b7c92;letter-spacing:.05em}
  table{width:100%;border-collapse:collapse;margin-top:6px}th,td{border:1px solid #ddd;padding:7px 9px;text-align:left;font-size:12.5px}th{background:#f4f6fa}
  .row{display:flex;gap:20px}.row>div{flex:1}
  .ass{margin-top:40px;display:flex;gap:40px}.ass>div{flex:1;border-top:1px solid #333;padding-top:5px;text-align:center;font-size:11px;color:#444}
  .ft{margin-top:18px;font-size:10.5px;color:#888;text-align:center}
  @media print{button{display:none}}
  </style></head><body>
  <h1>DECLARAÇÃO DE CONTEÚDO — Importação Internacional</h1>
  <div class="box"><h3>Remetente (Exportador)</h3><b>${REMET.nome}</b><br>${REMET.end}</div>
  <div class="box"><h3>Destinatário (Importador)</h3><b>${esc(p.nome||'—')}</b> &nbsp; CPF: <b>${esc(p.cpf||'—')}</b><br>${esc(p.endereco||'—')}<br>Tel: ${esc(p.phone||'—')}</div>
  <div class="box"><h3>Conteúdo</h3><table><thead><tr><th>Descrição do produto</th><th style="width:80px;text-align:center">Qtd.</th></tr></thead><tbody>${linhas}</tbody></table></div>
  <div class="box"><h3>Declaração</h3>Declaro para os devidos fins que o conteúdo acima corresponde a produtos originais adquiridos em loja oficial nos Estados Unidos, destinados a uso pessoal do importador, dentro do limite de isenção aplicável.</div>
  <div class="ass"><div>Assinatura do responsável · ${REMET.nome}</div><div>Data: ${new Date().toLocaleDateString('pt-BR')}</div></div>
  <div class="ft">Pedido #${p.id} · IA USA · Importações dos EUA · gerado em ${new Date().toLocaleString('pt-BR')}</div>
  <p style="text-align:center;margin-top:16px"><button onclick="window.print()" style="padding:9px 18px;border:0;border-radius:8px;background:#f47920;color:#fff;font-weight:700;cursor:pointer">Imprimir / Salvar PDF</button></p>
  </body></html>`);
  w.document.close();
}

if(PASS){load();}else{loginView();}
</script>
</body>
</html>
